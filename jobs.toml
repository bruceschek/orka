# Orka jobs: non-Claude work that Orka reports on (and, from phase 5, controls).
#
# Fields:
#   id       short name shown on the dashboard (required, unique)
#   kind     "launchd" (a launchctl job) or "script" (a long-running process)
#   machine  "mba" or "mbp"
#   label    launchd only: the job's label, as in `launchctl list`
#   match    script only: regular expression matched against the process command line
#   log      optional: log file to show the tail of (launchd jobs default to their stdout path)
#   alert_on_stop  script only: true = phone alert when Orka saw it running and it is gone
#                  (finished or crashed; Orka can't tell which)

[[job]]
id      = "backup-dev"
kind    = "launchd"
machine = "mba"
label   = "com.bruceschechter.backup-dev"

[[job]]
id      = "tana-vectorsync"
kind    = "launchd"
machine = "mba"
label   = "com.tana.vectorsync"

# Chess (0085) compute on the M1: training, nightly game analysis, benchmarks.
# Launched from the MBA over SSH (chess BACKLOG R9). Narrow the pattern once the
# chess project settles its first M1 command.
[[job]]
id      = "chess-m1"
kind    = "script"
machine = "mbp"
match   = 'scripts/(train_human|train|analyze_my_games|arena_compare|benchmark|judge_gap|human_baseline|harvest_human|train_human_v2|human_pilot_eval)\.py|scripts/(train_human_bands|distill_scaleup|benchmark_series|rerun_band800|human_pilot|human_long)\.sh'
alert_on_stop = true

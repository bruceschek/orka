# Orka host configuration, shared by both Macs through git.
# Per-Mac differences go in orka.local.toml (not in git), which overrides this file.
# On the MBP it holds one line:  machine = "mbp"

machine = "mba"                          # name of this Mac: "mba" or "mbp" (MBP: set in orka.local.toml)
projects_root = "~/dev/projects"
claude_projects_dir = "~/.claude/projects" # Claude Code session logs
state_dir = "~/dev/.orka"                # orka.db, scorecard.json, events.jsonl (inside ~/dev so Claude can read it)

[serve]
port = 8765           # dashboard on http://127.0.0.1:<port>; `tailscale serve` publishes it to your devices
refresh_seconds = 30  # how often the dashboard collects

[thresholds]
active_minutes = 15   # activity newer than this = Active
stale_days     = 14   # no activity for longer than this = Stale

# Each Mac's dashboard address on the tailnet (from `tailscale serve`). Every Mac fetches the
# others' data from here and shows it, marked offline when that Mac can't be reached.
# Leave an address empty until that Mac runs Orka.
[machines]
mba = "https://bruce-mbair-26-04.taila48a19.ts.net"
mbp = "https://bruces-m1-mbp-2111.taila48a19.ts.net"

# Phone alerts through Pushover. Codes go in ~/dev/.orka/pushover.toml on each Mac (private).
# Only one Mac sends: the MBA, or the MBP while the MBA is off.
[alerts]
enabled = true
after_seconds = 120   # a "waiting on you" or failed job must last this long before it alerts

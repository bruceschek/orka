# Orka host configuration. To move Orka to another Mac, change this file only.

machine = "mba"                          # name of this Mac: "mba" or "mbp"
projects_root = "~/dev/projects"
claude_projects_dir = "~/.claude/projects" # Claude Code session logs
state_dir = "~/dev/.orka"                # orka.db, scorecard.json, events.jsonl (inside ~/dev so Claude can read it)

[thresholds]
active_minutes = 15   # activity newer than this = Active
stale_days     = 14   # no activity for longer than this = Stale
